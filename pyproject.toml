[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dlc-batcher"
version = "0.1.0"
description = "Batch video analysis for DeepLabCut models, with tuning for the local machine and a per-video quality check"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jobe Ritchie" }]
keywords = ["deeplabcut", "pose estimation", "video analysis", "neuroscience"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Intended Audience :: Science/Research",
]
# DeepLabCut is not listed: the app runs in (or points at) the environment
# where DeepLabCut is already installed, and uses the PySide6, OpenCV, pandas
# and psutil that come with it.
dependencies = ["PySide6>=6.4", "numpy", "pandas", "tables", "PyYAML", "psutil", "opencv-python-headless"]

[project.optional-dependencies]
test = ["pytest"]

[project.gui-scripts]
dlc-batcher = "dlc_batcher.gui.main_window:main"

[tool.setuptools.packages.find]
include = ["dlc_batcher*"]

[tool.setuptools.package-data]
dlc_batcher = ["assets/calibration/*.mp4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
